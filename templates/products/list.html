{% extends "base.html" %}{% block title %}Products{% endblock %}{% block content %}
<div class="d-flex justify-content-between mb-3"><h3>Products</h3><a class="btn btn-primary" href="{% url 'products:add' %}">Add Product</a></div>
<div class="table-responsive"><table class="table table-striped"><thead><tr><th>Name</th><th>SKU</th><th>Barcode</th><th>Price</th><th>Stock</th><th>Labels</th></tr></thead><tbody>
{% for p in products %}<tr><td>{{ p.name }}</td><td>{{ p.sku }}</td><td>{{ p.barcode }}</td><td>{{ p.price }}</td><td>{{ p.stock }}</td><td><a href="{% url 'products:label' p.pk %}">Print labels</a></td></tr>{% empty %}<tr><td colspan="6">No products yet.</td></tr>{% endfor %}
</tbody></table></div>{% endblock %}

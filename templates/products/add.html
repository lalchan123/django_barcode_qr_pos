{% extends "base.html" %}{% block content %}<h3 class="mb-3">Add Product</h3>
<form method="post" class="card card-body" style="max-width:650px">{% csrf_token %}
<label class="form-label">Product name</label><input class="form-control mb-3" name="name" required>
<label class="form-label">SKU</label><input class="form-control mb-3" name="sku" required>
<label class="form-label">Barcode value (unique)</label><input class="form-control mb-3" name="barcode" required placeholder="e.g. 8901234567890">
<label class="form-label">Barcode type</label><select class="form-select mb-3" name="barcode_type"><option value="code128">Code 128 (recommended)</option><option value="ean13">EAN-13 (13 digits only)</option></select>
<div class="row"><div class="col"><label class="form-label">Selling price</label><input class="form-control mb-3" type="number" name="price" min="0" step="0.01" required></div><div class="col"><label class="form-label">Opening stock</label><input class="form-control mb-3" type="number" name="stock" min="0" required></div></div>
<label class="form-label">Description</label><textarea class="form-control mb-3" name="description"></textarea>
<button class="btn btn-primary">Save Product & Generate Codes</button></form>{% endblock %}

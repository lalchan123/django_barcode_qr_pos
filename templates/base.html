<body><nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/">Barcode QR POS</a><div><a class="nav-link d-inline text-white me-3" href="/">POS</a><a class="nav-link d-inline text-white" href="/products/">Products</a></div></div></nav>
